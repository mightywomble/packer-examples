---
# php: PHP + Apache integration. Debian uses mod_php (auto-enabled by
# the libapache2-mod-php package); RedHat uses php-fpm proxied by httpd.
- name: Load distribution-specific variables (php)
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Install PHP and Apache integration
  ansible.builtin.package:
    name: "{{ php_packages }}"
    state: present
  notify: Restart Apache after PHP install

- name: Enable and start php-fpm (RedHat family)
  ansible.builtin.service:
    name: php-fpm
    state: started
    enabled: true
  when: ansible_facts['os_family'] == 'RedHat'
